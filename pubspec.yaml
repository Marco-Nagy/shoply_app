name: shoply
description: "shop app"
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  internet_connection_checker: any
  flutter:
    sdk: flutter

  # Firebase
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.1
  googleapis_auth: ^2.0.0
  google_sign_in: ^6.3.0
  flutter_facebook_auth: ^7.1.5
  cloud_firestore: any
  firebase_database: any
  firebase_storage: any
  google_mlkit_translation: ^0.13.0


  # Core & Utils
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  intl_utils: ^2.8.2
  flutter_native_splash: ^2.4.0
  google_fonts: ^6.2.1
  get_it: ^9.2.0
  package_info_plus: ^8.0.2
  equatable: ^2.0.5

  # Localization
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8

  # UI
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  animate_do: ^4.2.0
  animations: ^2.0.11
  oktoast: ^3.4.0
  awesome_snackbar_content: ^0.1.3
  font_awesome_flutter: ^10.7.0
  flutter_zoom_drawer: ^3.2.0
  shimmer: ^3.0.0
  flutter_swipe_action_cell: ^3.1.3
  vibration: ^3.1.3
  cached_network_image: ^3.4.1
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  carousel_slider: ^5.0.0

  # Image handling
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  card_swiper: ^3.0.1
  path_provider: ^2.1.3

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # Shared prefs
  shared_preferences: ^2.2.3

  # Code generation
  freezed_annotation: ^2.4.4

  # APIs
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  retrofit: ">=4.4.4 <4.9.0"  # Temporarily disabled for build_runner
  json_annotation: ^4.9.0
  dropdown_search: ^5.0.6
# Data Source database Hive
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  injectable: 2.7.1+4


dev_dependencies:
  # Unit testing
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
#    core
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  very_good_analysis: ^9.0.0


#  test: ^1.17.1
#  flutter_test_platform_widgets: ^3.1.0
#  flutter_driver: ^0.11.0

#  freezed
# dart run build_runner build --delete-conflicting-outputs
  freezed: ^2.5.2
  build_runner: ^2.4.11


#  Remote Database using APIs
  retrofit_generator: ^9.0.0
  json_serializable: ^6.8.0
# Local Database using localDataSource generator
  hive_ce_generator: ^1.4.0
  injectable_generator: ^2.7.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/core/android_ios_splash_12.png"
  adaptive_icon_background: "assets/images/core/launcher_background.png"
  adaptive_icon_foreground: "assets/images/core/launcher_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - .env.firebase
    - assets/images/admin/
    - assets/images/core/
    - assets/images/customer/
    - assets/images/json/
    - assets/images/svg/
    - translations/ar.json
    - translations/en.json

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400
    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400
